<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">generational-marketing-review</title>
<desc id="d">Three panels from the repo's cross-generation eval scenario, a fictional plan with a recorded run of the skill. 1, the plan's headline trust line, The financial app trusted by every generation, with no source, rating, review, or substantiation. 2, the review's evidence register: Label, Assumption stated as fact (deception risk); Source supplied, None; Confidence, Low; Action, Remove / Verify. 3, the verdict: Fit, Weak fit; Confidence, Medium; Recommended decision, Revise and retest; critical fix 2, Remove or substantiate the trust line.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.r1{animation:r1 12s infinite}
.r2{animation:r2 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.rd{animation:rd 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
.rg{animation:rg 12s infinite}
.rh{animation:rh 12s infinite}
@keyframes h1{0%,16.7%{opacity:0}18.7%,42.4%{opacity:1}44.1%,100%{opacity:0}}
@keyframes h2{0%,16.7%,18.7%,44.1%{opacity:0}45.8%,67.8%{opacity:1}69.5%,100%{opacity:0}}
@keyframes h3{0%,16.7%,18.7%,69.5%{opacity:0}71.2%,94.9%{opacity:1}96.6%,100%{opacity:0}}
@keyframes r1{0%,16.7%{opacity:1}18.7%,20.4%{opacity:0}22.1%,100%{opacity:1}}
@keyframes r2{0%,16.7%{opacity:1}18.7%,30.6%{opacity:0}32.2%,100%{opacity:1}}
@keyframes rb{0%,16.7%{opacity:1}18.7%,45%{opacity:0}46.6%,100%{opacity:1}}
@keyframes rc{0%,16.7%{opacity:1}18.7%,50%{opacity:0}51.7%,100%{opacity:1}}
@keyframes rd{0%,16.7%{opacity:1}18.7%,55.1%{opacity:0}56.8%,100%{opacity:1}}
@keyframes re{0%,16.7%{opacity:1}18.7%,59.3%{opacity:0}61%,100%{opacity:1}}
@keyframes rf{0%,16.7%{opacity:1}18.7%,63.6%{opacity:0}65.3%,100%{opacity:1}}
@keyframes rg{0%,16.7%{opacity:1}18.7%,72.1%{opacity:0}73.7%,100%{opacity:1}}
@keyframes rh{0%,16.7%{opacity:1}18.7%,82.2%{opacity:0}83.9%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="50" class="serif" font-size="28" fill="#e4dfd4">generational-marketing-review</text>
<text x="434" y="50" class="sans" font-size="13.5" fill="#a9adb2">Portable agent skill for reviewing marketing plans and assets</text>

<g>
<text x="32" y="88" class="sans lab" fill="#a39bbd">1 · A CAMPAIGN PLAN</text>
<rect x="32" y="98" width="252" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="98" width="252" height="152" rx="3" stroke="#a39bbd"/>
<text x="44" y="115" class="mono" font-size="10" fill="#8b9096">input.md · fictional plan</text>
<line x1="33" y1="123" x2="283" y2="123" stroke="#2e3237"/>
<g class="r1"><text x="44" y="145" class="sans" font-size="10.5" fill="#e4dfd4">The plan also proposes a headline trust</text><text x="44" y="160" class="sans" font-size="10.5" fill="#e4dfd4">line for all placements: "The financial</text><text x="44" y="175" class="sans" font-size="10.5" fill="#e4dfd4">app trusted by every generation." No</text><text x="44" y="190" class="sans" font-size="10.5" fill="#e4dfd4">source, rating, review, or substantiation</text><text x="44" y="205" class="sans" font-size="10.5" fill="#e4dfd4">is attached to this line.</text></g>
<rect class="r2" x="40" y="150" width="226" height="31" fill="none" stroke="#c8963e" stroke-dasharray="3 2"/>
<text x="32" y="272" class="sans cap">A fictional plan with an unsourced claim.</text>
</g>

<g>
<text x="304" y="88" class="sans lab" fill="#c8963e">2 · EVIDENCE REGISTER</text>
<rect x="304" y="98" width="302" height="152" rx="3" fill="#17191c" stroke="#2e3237"/>
<rect class="hl h2" x="304" y="98" width="302" height="152" rx="3" stroke="#c8963e"/>
<text x="316" y="115" class="mono" font-size="10" fill="#8b9096">skill-output.md · recorded eval run</text>
<line x1="305" y1="123" x2="605" y2="123" stroke="#2e3237"/>
<g class="rb"><text x="316" y="143" class="mono" font-size="10" fill="#8b9096">Claim</text><text x="420" y="143" class="sans" font-size="10.5" fill="#e4dfd4">"The financial app trusted by</text><text x="420" y="157" class="sans" font-size="10.5" fill="#e4dfd4">every generation"</text></g>
<g class="rc"><text x="316" y="175" class="mono" font-size="10" fill="#8b9096">Label</text><text x="420" y="175" class="sans" font-size="10.5" fill="#e4dfd4">Assumption stated as fact</text><text x="420" y="189" class="sans" font-size="10.5" fill="#e4dfd4">(deception risk)</text></g>
<g class="rd"><text x="316" y="207" class="mono" font-size="10" fill="#8b9096">Source supplied</text><text x="420" y="207" class="sans" font-size="10.5" fill="#c8963e">None</text></g>
<g class="re"><text x="316" y="223" class="mono" font-size="10" fill="#8b9096">Confidence</text><text x="420" y="223" class="sans" font-size="10.5" fill="#c8963e">Low</text></g>
<g class="rf"><text x="316" y="239" class="mono" font-size="10" fill="#8b9096">Action</text><text x="420" y="239" class="sans" font-size="10.5" fill="#e4dfd4">Remove / Verify</text></g>
<text x="304" y="272" class="sans cap">The review labels it and asks for a source.</text>
</g>

<g>
<text x="626" y="88" class="sans lab" fill="#93ad8c">3 · THE VERDICT</text>
<rect x="626" y="98" width="242" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h3" x="626" y="98" width="242" height="152" rx="3" stroke="#93ad8c"/>
<text x="638" y="115" class="mono" font-size="10" fill="#8b9096">skill-output.md · recorded eval run</text>
<line x1="627" y1="123" x2="867" y2="123" stroke="#2e3237"/>
<g class="rg"><text x="638" y="143" class="sans" font-size="10.5" fill="#e4dfd4"><tspan font-weight="700">Fit:</tspan> Weak fit</text><text x="638" y="158" class="sans" font-size="10.5" fill="#e4dfd4"><tspan font-weight="700">Confidence:</tspan> Medium</text><text x="638" y="173" class="sans" font-size="10.5" fill="#e4dfd4"><tspan font-weight="700">Recommended decision:</tspan></text><text x="638" y="187" class="sans" font-size="10.5" fill="#93ad8c">Revise and retest</text></g>
<g class="rh"><line x1="638" y1="197.5" x2="856" y2="197.5" stroke="#2e3237"/><text x="638" y="214" class="mono" font-size="10" fill="#8b9096">### Critical</text><text x="638" y="230" class="sans" font-size="10.5" fill="#e4dfd4">2. <tspan font-weight="700">Remove or substantiate the</tspan></text><text x="651" y="244" class="sans" font-size="10.5" fill="#e4dfd4" font-weight="700">trust line.</text></g>
<text x="626" y="272" class="sans" font-size="11.5" fill="#93ad8c">A verdict and the fix to make first.</text>
</g>
</svg>
