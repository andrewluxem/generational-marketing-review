name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_structure.py
      - run: python scripts/scan_public_claims.py
      - run: python scripts/build_skill.py
      - run: unzip -l dist/generational-marketing-review.skill
      - run: test "$(unzip -Z1 dist/generational-marketing-review.skill | cut -d/ -f1 | sort -u | wc -l)" -eq 1
      - run: "! unzip -l dist/generational-marketing-review.skill | grep -i README"
      - run: "! unzip -p dist/generational-marketing-review.skill | grep -Ei '@[A-Za-z0-9_.]{2,}|[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}'"
