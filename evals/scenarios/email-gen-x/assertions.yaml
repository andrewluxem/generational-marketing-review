# Assertions for the email-gen-x evaluation scenario.
#
# This scenario tests the skill's ASSET-review workflow (a single lifecycle
# email) rather than the full-plan-review workflow exercised by
# media-plan-millennials. The deterministic output contract is the same because
# SKILL.md routes both plan and asset reviews to the same output contract and
# the same review-report-template.md; only the semantic assertions are
# scenario-specific.
#
# Two explicitly separated groups:
#   deterministic - checked by scripts/validate_eval.py with no LLM.
#   semantic      - require an LLM grader; results are recorded in
#                   grader-output.json and consumed (not recomputed) by the
#                   validator.
#
# Each assertion has: id, description, severity (required|advisory),
# evaluation (deterministic|llm), applies_to (baseline|skill|both).
#
# Gating rule: the build fails if any required assertion fails. For required
# semantic assertions, an "uncertain" grader result counts as a failure, and
# gating is applied to the skill output. Baseline results are recorded for
# comparison and are informational only.
#
# Assertions were written and frozen BEFORE either model run and before
# grading; the semantic checks are not engineered to force the skill to win, and
# an honest tie is preserved wherever both outputs satisfy a requirement.
#
# rubric_dimensions is the single source of truth for the twelve rubric
# dimensions. The deterministic structural check normalizes these canonical
# names (lowercase, drop punctuation and conjunctions) and requires each to
# appear in the skill output. Matchers are not tuned to any specific output.

version: 2
scenario: email-gen-x

rubric_dimensions:
  - Audience definition
  - Customer need and context
  - Value proposition
  - Message and tone
  - Creative and format
  - Channel and platform fit
  - Trust and proof
  - Offer and purchase friction
  - Customer experience and fulfillment
  - Inclusion, accessibility, privacy, and ethics
  - Measurement and experimentation
  - Evidence quality

deterministic:
  - id: files-present
    description: All required scenario files exist in the scenario directory.
    severity: required
    evaluation: deterministic
    applies_to: both
  - id: run-metadata-valid
    description: run-metadata.json parses and contains the required run and isolation fields.
    severity: required
    evaluation: deterministic
    applies_to: both
  - id: grader-output-schema-valid
    description: grader-output.json parses and matches the required grader-result schema.
    severity: required
    evaluation: deterministic
    applies_to: both
  - id: artifact-hashes-bound
    description: Every recorded artifact SHA-256 matches the recomputed hash of the file on disk.
    severity: required
    evaluation: deterministic
    applies_to: both
  - id: grader-binding-valid
    description: Each grader result set is cryptographically bound to the exact graded output, input, assertions, and grader prompt.
    severity: required
    evaluation: deterministic
    applies_to: both
  - id: verdict-present
    description: The skill output states an explicit fit verdict.
    severity: required
    evaluation: deterministic
    applies_to: skill
  - id: confidence-present
    description: The skill output states an explicit confidence level.
    severity: required
    evaluation: deterministic
    applies_to: skill
  - id: audience-definition-check-present
    description: The skill output includes an audience-definition check section.
    severity: required
    evaluation: deterministic
    applies_to: skill
  - id: scorecard-present
    description: The skill output includes a scorecard.
    severity: required
    evaluation: deterministic
    applies_to: skill
  - id: twelve-dimensions-present
    description: The skill output scorecard names all twelve canonical rubric dimensions.
    severity: required
    evaluation: deterministic
    applies_to: skill
  - id: priority-fixes-present
    description: The skill output includes prioritized fixes.
    severity: required
    evaluation: deterministic
    applies_to: skill
  - id: test-plan-present
    description: The skill output includes a test plan or measurement recommendations.
    severity: required
    evaluation: deterministic
    applies_to: skill
  - id: final-recommendation-present
    description: The skill output includes a final recommendation.
    severity: required
    evaluation: deterministic
    applies_to: skill
  - id: stereotype-flags-present
    description: The skill output includes a stereotype, evidence, and freshness flags section.
    severity: advisory
    evaluation: deterministic
    applies_to: skill
  - id: evidence-register-present
    description: The skill output includes an evidence register.
    severity: advisory
    evaluation: deterministic
    applies_to: skill

semantic:
  - id: no-invented-statistics
    description: The review does not invent or assert quantitative statistics, percentages, dates, birth ranges, open or click rates, or channel-preference figures as current facts that were not supplied in the email or plan.
    severity: required
    evaluation: llm
    applies_to: both
  - id: no-deterministic-generational-behavior
    description: The review does not present Gen X behavior, values, or channel preferences as deterministic or universal; it treats generation as a lens or hypothesis, not proof of how this audience will behave.
    severity: required
    evaluation: llm
    applies_to: both
  - id: avoids-discriminatory-targeting
    description: The review avoids recommending discriminatory, exclusionary, or stereotype-based targeting and does not endorse the email's age-coded framing as a sound targeting strategy.
    severity: required
    evaluation: llm
    applies_to: both
  - id: distinguishes-evidence-types
    description: The review distinguishes what is observed in the email from what is inferred and what is assumed, for example by labeling claims or otherwise separating evidence from assumption.
    severity: required
    evaluation: llm
    applies_to: skill
  - id: recognizes-strong-element
    description: The review recognizes at least one genuinely strong element of the email, such as the transparent price comparison or the transparent cancellation and pre-visit reminder terms.
    severity: advisory
    evaluation: llm
    applies_to: both
  - id: proposes-measurable-tests
    description: The review proposes measurable tests or experiments (for example a subject-line test, a value-framing test, or a holdout) rather than simply replacing one unproven assumption with another assertion.
    severity: required
    evaluation: llm
    applies_to: both
  - id: ties-verdict-to-evidence
    description: The review ties its overall verdict or recommendation to specific evidence and the email's material risks rather than to a vague overall impression.
    severity: required
    evaluation: llm
    applies_to: skill
  - id: subject-line-vague-nostalgia
    description: The review identifies the nostalgia-based subject line as vague or off-objective rather than assuming nostalgia is inherently effective for this audience.
    severity: required
    evaluation: llm
    applies_to: both
  - id: flags-age-coded-language
    description: The review flags the age-coded or patronizing language (for example the generational self-reliance framing or "that is just how your generation was raised") as a tone risk rather than treating it as good audience empathy.
    severity: required
    evaluation: llm
    applies_to: both
  - id: delayed-value-proposition
    description: The review identifies that the long nostalgic opening delays the value proposition, so the concrete benefit and price appear too late in the email.
    severity: required
    evaluation: llm
    applies_to: both
  - id: recognizes-price-comparison-strength
    description: The review recognizes the concrete annual-versus-a-la-carte price comparison (about $348 versus $540, saving roughly $192) as a genuinely useful and credible element that speaks to the customer's save-time-or-money objective.
    severity: advisory
    evaluation: llm
    applies_to: both
  - id: challenges-email-channel-assumption
    description: The review challenges the unsupported assumption that Gen X universally prefers email over every other channel and that a single email is therefore sufficient, treating it as an untested assumption rather than a fact.
    severity: required
    evaluation: llm
    applies_to: both
  - id: challenges-longevity-trust-claim
    description: The review challenges the "trusted by families for decades" claim as unsupported or weak proof, given that no verifiable evidence, reviews, ratings, or substantiation are provided.
    severity: required
    evaluation: llm
    applies_to: both
  - id: cta-visibility-without-pressure
    description: The review identifies that the single call to action appears only once near the bottom and recommends improving its visibility or repetition without resorting to manipulative urgency or spammy pressure.
    severity: advisory
    evaluation: llm
    applies_to: both
  - id: mobile-and-small-print-risk
    description: The review identifies mobile readability or rendering risk (for example the absence of mobile-layout guidance, the below-the-fold price comparison, or button and font legibility) and/or flags the small-print-heavy terms block as a readability, accessibility, or trust concern.
    severity: required
    evaluation: llm
    applies_to: both
  - id: missing-incrementality-renewal-unsub
    description: The review identifies that the measurement plan tracks only the purchase event and is missing at least incrementality or a holdout and first-year renewal or retention measurement, and ideally also flags unsubscribe quality or list health.
    severity: required
    evaluation: llm
    applies_to: both
  - id: preserves-cancellation-reminder-detail
    description: The review preserves, strengthens, or credits the transparent cancellation terms and the pre-visit reminder timing rather than discarding these trust-building operational details.
    severity: advisory
    evaluation: llm
    applies_to: both
  - id: specific-revisions-not-generic
    description: The review proposes specific copy or layout revisions (for example a concrete alternative subject line, moving the value proposition and price higher, or a mobile-legible call to action) rather than only generic advice such as make it more engaging.
    severity: advisory
    evaluation: llm
    applies_to: both
